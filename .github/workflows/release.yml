name: Release

# Push a tag like v0.1.0 to build the universal app and attach the .dmg to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: ARCHS="arm64 x86_64" VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh

      - name: Build DMG
        run: scripts/make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.dmg --title "$GITHUB_REF_NAME" --generate-notes
